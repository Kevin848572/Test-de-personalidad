<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Personalidad — Cervecería Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-logos">
    <img src="img/logocerveria.png" alt="" class="bg-logo bg-logo--left">
    <img src="img/logo_UNAH.png" alt="" class="bg-logo bg-logo--right">
  </div>

  <!-- ===== LOGIN ===== -->
  <section id="loginSection">
    <div class="card login-card">
      <div class="brand-logos">
        <img src="img/logocerveria.png" alt="Cervecería Hondureña" class="brand-logo">
        <img src="img/logo_UNAH.png" alt="UNAH" class="brand-logo">
      </div>
      <h1 class="login-title">Test de Personalidad Institucional</h1>
      <p class="login-sub">Evaluación de Perfil — MBTI</p>
      <div class="login-body">
        <div class="input-group">
          <input type="text" id="nameInput" placeholder="Nombre completo" autocomplete="off">
        </div>
        <button id="startBtn" class="btn-primary">Iniciar Test</button>
      </div>
    </div>
  </section>

  <!-- ===== QUIZ ===== -->
  <section id="quizSection" class="hidden">
    <div class="card quiz-card">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-info">
        <span id="progressText">1 / 70</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="question-block">
        <div class="question-meta">
          <span class="question-number" id="questionNumber">Pregunta 1</span>
          <span class="dimension-tag" id="dimensionTag">E/I</span>
        </div>
        <h2 class="question-text" id="questionText"></h2>
      </div>
      <div class="options-list" id="optionsList">
        <button class="option-btn" data-value="A">
          <span class="opt-key">A</span>
          <span class="opt-label" id="optALabel"></span>
        </button>
        <button class="option-btn" data-value="B">
          <span class="opt-key">B</span>
          <span class="opt-label" id="optBLabel"></span>
        </button>
      </div>
      <div class="nav-buttons">
        <button id="prevBtn" class="btn-nav btn-prev" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Anterior
        </button>
        <button id="nextBtn" class="btn-nav btn-next">
          Siguiente
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button id="submitBtn" class="btn-primary btn-submit hidden">Ver Resultados</button>
      </div>
    </div>
  </section>

  <!-- ===== RESULTS ===== -->
  <section id="resultSection" class="hidden">
    <div class="card result-card">
      <div class="result-header">
        <div class="result-icon">✦</div>
        <button id="closeResultBtn" class="btn-close">&times;</button>
        <h2 class="result-title">Felicitaciones</h2>
        <p class="result-subtitle" id="resultName"></p>
        <p class="result-sub-detail">Has completado el Test de Personalidad</p>
      </div>
      <div class="result-body">
        <div class="personality-badge">
          <div class="badge-code" id="personalityCode">--</div>
          <div class="badge-label">Tipo de Personalidad</div>
        </div>
        <div class="scores-grid" id="scoresGrid"></div>
        <div class="perfil-section">
          <h3 class="perfil-titulo" id="txt-perfil"></h3>
          <p class="perfil-descripcion" id="txt-descripcion"></p>
          <div class="perfil-columnas">
            <div class="perfil-col">
              <h4 class="perfil-sub">Fortalezas</h4>
              <ul class="perfil-lista" id="lista-fortalezas"></ul>
            </div>
            <div class="perfil-col">
              <h4 class="perfil-sub perfil-sub--sec">Áreas de Mejora</h4>
              <ul class="perfil-lista" id="lista-debilidades"></ul>
            </div>
          </div>
        </div>
        <div class="result-actions">
          <button id="printBtn" class="btn-outline">Imprimir</button>
          <button id="restartBtn" class="btn-outline">Nuevo Test</button>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
